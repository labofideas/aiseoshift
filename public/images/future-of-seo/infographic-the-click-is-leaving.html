<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infographic — The Click Is Leaving | AISEOShift</title>
<style>
  html,body{margin:0;background:#0f1219;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;}
  .wrap{width:1080px;max-width:100%;}
  svg{width:100%;height:auto;display:block;}
</style></head>
<body><div class="wrap"><svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1620" viewBox="0 0 1080 1620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1e2e"/>
      <stop offset="100%" stop-color="#0f1219"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d96a3a"/>
      <stop offset="100%" stop-color="#e8834f"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1620" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="10" fill="url(#accent)"/>

  <!-- Header -->
  <text x="540" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#d96a3a">THE FUTURE OF SEARCH</text>
  <text x="540" y="235" text-anchor="middle" font-family="Georgia, serif" font-size="76" font-weight="700" fill="#e4e2dc" letter-spacing="-2">The Click Is Leaving</text>
  <text x="540" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#e4e2dc" opacity="0.7">And it was never the thing you wanted anyway.</text>

  <!-- Stat band -->
  <rect x="60" y="380" width="960" height="420" rx="20" fill="#ffffff" opacity="0.04"/>
  <text x="540" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#e4e2dc" opacity="0.55">WHERE SEARCH IS IN 2026</text>
  
    <text x="250" y="640" text-anchor="middle" font-family="Georgia, serif" font-size="92" font-weight="700" fill="#e8834f">43%</text>
    <text x="250" y="688" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#e4e2dc" opacity="0.8">of Google searches</text>
    <text x="250" y="716" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#e4e2dc" opacity="0.8">end with no click</text>
  
    <text x="540" y="640" text-anchor="middle" font-family="Georgia, serif" font-size="92" font-weight="700" fill="#e8834f">93%</text>
    <text x="540" y="688" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#e4e2dc" opacity="0.8">no click when</text>
    <text x="540" y="716" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#e4e2dc" opacity="0.8">Google's AI Mode runs</text>
  
    <text x="830" y="640" text-anchor="middle" font-family="Georgia, serif" font-size="92" font-weight="700" fill="#e8834f">1.6%</text>
    <text x="830" y="688" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#e4e2dc" opacity="0.8">top-result CTR</text>
    <text x="830" y="716" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#e4e2dc" opacity="0.8">(was 7.6%)</text>
  <line x1="395" y1="560" x2="395" y2="700" stroke="#e4e2dc" stroke-width="1" opacity="0.12"/>
  <line x1="685" y1="560" x2="685" y2="700" stroke="#e4e2dc" stroke-width="1" opacity="0.12"/>

  <!-- The reframe -->
  <text x="540" y="900" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#e4e2dc">The game changed</text>

  <rect x="60" y="950" width="455" height="230" rx="18" fill="#ffffff" opacity="0.03"/>
  <rect x="60" y="950" width="6" height="230" rx="3" fill="#e4e2dc" opacity="0.25"/>
  <text x="100" y="1010" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#e4e2dc" opacity="0.5">OLD GAME</text>
  <text x="100" y="1070" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#e4e2dc">Ranking</text>
  <text x="100" y="1120" font-family="Arial, sans-serif" font-size="24" fill="#e4e2dc" opacity="0.75">Be on the list.</text>
  <text x="100" y="1152" font-family="Arial, sans-serif" font-size="24" fill="#e4e2dc" opacity="0.75">A list can be gamed.</text>

  <rect x="565" y="950" width="455" height="230" rx="18" fill="#d96a3a" opacity="0.12"/>
  <rect x="565" y="950" width="6" height="230" rx="3" fill="url(#accent)"/>
  <text x="605" y="1010" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#e8834f">NEW GAME</text>
  <text x="605" y="1070" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#e4e2dc">Citation</text>
  <text x="605" y="1120" font-family="Arial, sans-serif" font-size="24" fill="#e4e2dc" opacity="0.85">Be the name repeated.</text>
  <text x="605" y="1152" font-family="Arial, sans-serif" font-size="24" fill="#e4e2dc" opacity="0.85">Trust is harder to fake.</text>

  <!-- Analogy -->
  <text x="540" y="1290" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-style="italic" fill="#e4e2dc" opacity="0.85">
    <tspan x="540" dy="0">Search went from a phone book</tspan>
    <tspan x="540" dy="46">to a friend who knows everything.</tspan>
  </text>
  <text x="540" y="1410" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#e4e2dc" opacity="0.6">
    <tspan x="540" dy="0">You are no longer trying to be on the list.</tspan>
    <tspan x="540" dy="42">You are trying to be the name it says out loud.</tspan>
  </text>

  <!-- Footer -->
  <line x1="60" y1="1500" x2="1020" y2="1500" stroke="#d96a3a" stroke-width="1" opacity="0.4"/>
  <text x="60" y="1555" font-family="Georgia, serif" font-size="30" fill="#e4e2dc" opacity="0.85">AISEOShift</text>
  <text x="1020" y="1555" text-anchor="end" font-family="Arial, sans-serif" font-size="22" fill="#e4e2dc" opacity="0.45">aiseoshift.com</text>
</svg></div></body></html>
