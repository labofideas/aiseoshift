<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Editorial hero graphic titled 10 Websites Better Than Another Hour of Doomscrolling, with four labeled categories: rabbit holes, long reads, playful discovery, and daily wonder">
  <rect width="1200" height="675" fill="rgb(246,245,240)" />
  <rect x="0" y="0" width="10" height="675" fill="rgb(184,85,46)" />
  <line x1="80" y1="112" x2="1120" y2="112" stroke="rgb(14,17,22)" stroke-opacity="0.12" />
  <line x1="80" y1="430" x2="1120" y2="430" stroke="rgb(14,17,22)" stroke-opacity="0.12" />
  <text x="80" y="78" font-family="Georgia, serif" font-size="15" letter-spacing="4" fill="rgb(184,85,46)">THE BETTER TAB</text>
  <text x="1120" y="78" text-anchor="end" font-family="Georgia, serif" font-size="15" letter-spacing="3" fill="rgb(14,17,22)" fill-opacity="0.45">AISEOSHIFT</text>
