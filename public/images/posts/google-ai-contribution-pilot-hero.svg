<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Flow diagram showing content used in an AI answer, Google scoring its value, and a payout appearing in Search Console">
  <rect width="1200" height="675" fill="rgb(246,245,240)" />
  <rect x="0" y="0" width="10" height="675" fill="rgb(184,85,46)" />
  <line x1="80" y1="112" x2="1120" y2="112" stroke="rgb(14,17,22)" stroke-opacity="0.12" />
  <line x1="80" y1="404" x2="1120" y2="404" stroke="rgb(14,17,22)" stroke-opacity="0.12" />
  <text x="80" y="78" font-family="Georgia, serif" font-size="15" letter-spacing="4" fill="rgb(184,85,46)">AI SEO NEWS</text>
  <text x="1120" y="78" text-anchor="end" font-family="Georgia, serif" font-size="15" letter-spacing="3" fill="rgb(14,17,22)" fill-opacity="0.45">AISEOSHIFT</text>
  <text x="80" y="214" font-family="Georgia, serif" font-size="50" font-weight="700" fill="rgb(14,17,22)">Google Is Paying Some</text>
  <text x="80" y="272" font-family="Georgia, serif" font-size="50" font-weight="700" fill="rgb(14,17,22)">Publishers for AI Answers</text>
  <text x="80" y="374" font-family="Georgia, serif" font-size="19" font-style="italic" fill="rgb(14,17,22)" fill-opacity="0.62">A Search Console widget pays for value, not clicks. Nobody outside Google can see the formula.</text>
  <g transform="translate(80 452)">
    <rect width="308" height="70" rx="5" fill="rgb(250,250,247)" stroke="rgb(14,17,22)" stroke-opacity="0.18" />
    <text x="154" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="rgb(14,17,22)">Content shapes an AI answer</text>
  </g>
  <path d="M 392 487 L 408 487" stroke="rgb(14,17,22)" stroke-opacity="0.25" />
  <g transform="translate(412 452)">
    <rect width="308" height="70" rx="5" fill="rgb(250,250,247)" stroke="rgb(14,17,22)" stroke-opacity="0.18" />
    <text x="154" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="rgb(14,17,22)">Google scores it (black box)</text>
  </g>
  <path d="M 724 487 L 740 487" stroke="rgb(14,17,22)" stroke-opacity="0.25" />
  <g transform="translate(744 452)">
    <rect width="296" height="70" rx="5" fill="rgb(14,17,22)" stroke="rgb(184,85,46)" stroke-width="1.5" />
    <text x="148" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="rgb(250,250,247)">Payout in Search Console</text>
  </g>
</svg>
