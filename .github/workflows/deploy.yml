name: Deploy Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_MAILCHIMP_FORM_ACTION: ${{ secrets.PUBLIC_MAILCHIMP_FORM_ACTION }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiseoshift-dist
          path: dist/

      # Deploys to the Wbcom Designs Cloudflare account (Worker aiseoshift-com).
      # Skipped until the CLOUDFLARE_API_TOKEN secret exists, so merging this
      # changes nothing on its own. Every push to main deploys, including the
      # scheduled daily empty commit that publishes posts dated today.
      - name: Deploy to Cloudflare
        if: env.HAS_CF_TOKEN == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 496ea682d68a5f3d045fc8b3a6ec03a4
