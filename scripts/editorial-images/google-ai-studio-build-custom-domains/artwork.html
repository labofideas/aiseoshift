<!doctype html><html lang="en"><meta charset="utf-8"><title>thumb</title>
<style>
*{box-sizing:border-box;margin:0}body{background:#ccc;font-family:"Arial Black",Arial,Helvetica,sans-serif}
.thumb{width:1280px;height:720px;position:relative;overflow:hidden;background:#0d0d10;color:#fff;padding:56px 64px}
.thumb:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% 30%,#ea5b2a55,transparent 46%),radial-gradient(circle at 8% 100%,#ffcf3f22,transparent 40%)}
.thumb>*{position:relative}
.brand{font:800 26px Arial,sans-serif;letter-spacing:4px;color:#f2e9dc}.brand b{color:#ea5b2a}
.bar{margin-top:34px;display:flex;align-items:center;gap:18px;background:#f2e9dc;color:#0d0d10;border-radius:18px;padding:18px 26px;box-shadow:10px 10px 0 #000;width:1000px}
.dots{display:flex;gap:10px}.dots i{width:20px;height:20px;border-radius:50%;background:#ea5b2a;display:block}.dots i:nth-child(2){background:#ffcf3f}.dots i:nth-child(3){background:#0d0d10}
.url{font:700 40px Arial,sans-serif;flex:1}.url s{text-decoration:none;color:#999}.url b{color:#ea5b2a}
.lock{font:900 34px Arial,sans-serif;color:#0d0d10}
h1{font-size:112px;line-height:.95;letter-spacing:-4px;margin-top:44px;text-transform:uppercase;text-shadow:7px 7px 0 #000}
h1 span{color:#ea5b2a;display:block}
.badge{position:absolute;right:64px;bottom:48px;padding:12px 22px;background:#ffcf3f;color:#0d0d10;font-size:32px;letter-spacing:2px;transform:rotate(-2deg)}
.note{position:absolute;left:64px;bottom:48px;font:700 30px Arial,sans-serif;color:#f2e9dc}.note b{color:#ffcf3f}
</style>
<section class="thumb" id="feature">
<div class="brand">AISEO<b>SHIFT</b> / NEWS</div>
<div class="bar"><div class="dots"><i></i><i></i><i></i></div><div class="url"><s>my-app.ai.studio</s> &rarr; <b>yourbrand.com</b></div><div class="lock">HTTPS</div></div>
<h1>AI Studio now<span>ships custom<br>domains</span></h1>
<div class="note"><b>Not free:</b> $12+/yr domain + $2.40+/yr DNS</div>
<div class="badge">NOV 2026</div>
</section></html>
