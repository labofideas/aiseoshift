<!doctype html><html lang="en"><meta charset="utf-8"><title>thumb</title>
<style>
*{box-sizing:border-box;margin:0}body{background:#ccc;font-family:"Arial Black",Arial,Helvetica,sans-serif}
.thumb{width:1280px;height:720px;position:relative;overflow:hidden;background:#0d0d10;color:#fff;padding:56px 64px}
.thumb:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 82% 45%,#ea5b2a55,transparent 46%),radial-gradient(circle at 8% 100%,#ffcf3f22,transparent 40%)}
.thumb>*{position:relative}
.brand{font:800 26px Arial,sans-serif;letter-spacing:4px;color:#f2e9dc}.brand b{color:#ea5b2a}
.badge{display:inline-block;margin-top:34px;padding:10px 20px;background:#ffcf3f;color:#0d0d10;font-size:30px;letter-spacing:2px;transform:rotate(-2deg)}
h1{font-size:118px;line-height:.95;letter-spacing:-4px;margin-top:20px;text-transform:uppercase;text-shadow:7px 7px 0 #000}
h1 span{color:#ea5b2a;display:block}
.lens{position:absolute;right:70px;top:70px;width:400px;height:400px;border-radius:50%;border:26px solid #fff;background:#15151a;box-shadow:12px 12px 0 #000;display:grid;place-items:center;font-size:260px;color:#ea5b2a}
.handle{position:absolute;right:50px;top:420px;width:50px;height:190px;background:#fff;border-radius:25px;transform:rotate(-40deg);box-shadow:8px 8px 0 #000}
.list{position:absolute;left:64px;bottom:40px;font:700 30px Arial,sans-serif;color:#f2e9dc;line-height:1.45}
.list b{color:#ffcf3f}.list s{color:#ea5b2a;text-decoration:none}
.note{position:absolute;right:64px;bottom:54px;font:700 26px Arial,sans-serif;color:#f2e9dc}
</style>
<section class="thumb" id="feature">
<div class="brand">AISEO<b>SHIFT</b> / CHECKLIST</div>
<div class="badge">NOV 2026</div>
<h1>Is that<br>GTA 6 clip<span>AI?</span></h1>
<div class="lens">?</div><div class="handle"></div>
<div class="list"><b>&#10003;</b> Source &nbsp; <b>&#10003;</b> HUD text &nbsp; <b>&#10003;</b> Physics<br><s>&#10007;</s> Trust a detector score</div>
</section></html>
