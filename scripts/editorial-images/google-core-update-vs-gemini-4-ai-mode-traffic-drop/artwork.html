<!doctype html><html lang="en"><meta charset="utf-8"><title>thumb</title>
<style>
*{box-sizing:border-box;margin:0}body{background:#ccc;font-family:"Arial Black",Arial,Helvetica,sans-serif}
.thumb{width:1280px;height:720px;position:relative;overflow:hidden;background:#0d0d10;color:#fff;padding:56px 64px}
.thumb:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 78% 40%,#ea5b2a44,transparent 46%),radial-gradient(circle at 8% 100%,#ffcf3f22,transparent 40%)}
.thumb>*{position:relative}
.brand{font:800 26px Arial,sans-serif;letter-spacing:4px;color:#f2e9dc}.brand b{color:#ea5b2a}
.badge{display:inline-block;margin-top:30px;padding:10px 20px;background:#ffcf3f;color:#0d0d10;font-size:30px;letter-spacing:2px;transform:rotate(-2deg)}
h1{font-size:82px;line-height:.95;letter-spacing:-4px;margin-top:20px;text-transform:uppercase;text-shadow:7px 7px 0 #000}
h1 span{color:#ea5b2a;display:block}
.c{position:absolute;border-radius:50%;width:300px;height:300px;top:150px;display:grid;place-items:center;text-align:center;font:900 34px/1.05 Arial,sans-serif;text-transform:uppercase;box-shadow:10px 10px 0 #000}
.c1{right:236px;background:#ea5b2acc;border:12px solid #fff}
.c2{right:30px;background:#ffcf3fcc;border:12px solid #fff;color:#0d0d10}
.c small{display:block;font:700 24px Arial,sans-serif;margin-top:10px}
.vs{position:absolute;right:238px;top:260px;display:none;width:80px;height:80px;border-radius:50%;background:#0d0d10;border:6px solid #fff;font:900 30px/68px Arial,sans-serif;text-align:center;z-index:3}
.line{position:absolute;left:64px;right:64px;bottom:150px;height:8px;background:#f2e9dc;border-radius:4px;opacity:.0}
.tl{position:absolute;right:60px;width:560px;bottom:70px;height:70px}
.tl i{position:absolute;top:30px;left:0;right:0;height:8px;background:#f2e9dc;border-radius:4px}
.tl b{position:absolute;top:18px;width:32px;height:32px;border-radius:50%;border:6px solid #fff}
.tl em{position:absolute;top:-6px;font:700 24px Arial,sans-serif;font-style:normal;color:#f2e9dc;white-space:nowrap}
.q{position:absolute;left:64px;bottom:60px;font:700 30px Arial,sans-serif;color:#f2e9dc}.q s{color:#ffcf3f;text-decoration:none}
</style>
<section class="thumb" id="feature">
<div class="brand">AISEO<b>SHIFT</b> / TRAFFIC DIAGNOSIS</div>
<div class="badge">NOV 2026</div>
<h1>Core update<br>or Gemini 4<span style="display:inline">?</span></h1>
<div class="c c1"><div style="margin-right:70px">Core<br>update<small>Nov 10</small></div></div>
<div class="c c2"><div style="margin-left:60px">Gemini 4<br>AI Mode<small>Nov 12</small></div></div>
<div class="vs">+</div>
<div class="q"><s>Two changes.</s><br>One traffic dip.</div>
<div class="tl"><i></i><b style="left:0;background:#ea5b2a"></b><b style="left:140px;background:#ffcf3f"></b><em style="left:260px">overlap window</em></div>
</section></html>
