<style>
*{box-sizing:border-box;margin:0}body{background:#ccc;font-family:"Arial Black",Arial,Helvetica,sans-serif}
.thumb{width:1280px;height:720px;position:relative;overflow:hidden;background:#0d0d10;color:#fff;padding:56px 64px}
.thumb:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 40%,#ea5b2a44,transparent 48%),radial-gradient(circle at 5% 100%,#ffcf3f22,transparent 40%)}
.thumb>*{position:absolute}
.brand{left:64px;top:52px;font:800 26px Arial,sans-serif;letter-spacing:4px;color:#f2e9dc}.brand b{color:#ea5b2a}

.big .arr{color:#ffcf3f;font-size:150px;letter-spacing:0;margin:0 14px}.big .b{color:#fff}
.sub{left:64px;bottom:50px;font:700 40px Arial,sans-serif;color:#f2e9dc;letter-spacing:1px}.sub b{color:#ffcf3f}
.stack{right:64px;top:56px;width:250px;height:608px;display:flex;flex-direction:column;gap:5px;padding:16px;background:#15151a;border:6px solid #f2e9dc;border-radius:18px;box-shadow:10px 10px 0 #000}
.stack i{display:block;height:17px;border-radius:5px;flex:none}.keep{background:#ffcf3f}.cut{background:#3a3a44}
