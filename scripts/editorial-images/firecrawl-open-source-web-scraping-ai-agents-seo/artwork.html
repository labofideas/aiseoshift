<!doctype html><html lang="en"><meta charset="utf-8"><title>thumb</title>
<style>
*{box-sizing:border-box;margin:0}body{background:#ccc;font-family:"Arial Black",Arial,Helvetica,sans-serif}
.thumb{width:1280px;height:720px;position:relative;overflow:hidden;background:#0d0d10;color:#fff;padding:56px 64px}
.thumb:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% 30%,#ea5b2a55,transparent 46%),radial-gradient(circle at 8% 100%,#ffcf3f22,transparent 40%)}
.thumb>*{position:relative}
.brand{font:800 26px Arial,sans-serif;letter-spacing:4px;color:#f2e9dc}.brand b{color:#ea5b2a}
h1{font-size:104px;line-height:.95;letter-spacing:-4px;margin-top:40px;text-transform:uppercase;text-shadow:7px 7px 0 #000;width:700px}
h1 span{color:#ea5b2a;display:block}
.flow{position:absolute;right:64px;top:150px;width:430px}
.page{background:#f2e9dc;color:#0d0d10;border-radius:16px;padding:20px 22px;box-shadow:8px 8px 0 #000;font:700 22px Arial,sans-serif}
.page i{display:block;height:14px;background:#0d0d10;opacity:.25;border-radius:7px;margin-top:12px}.page i.h{height:22px;opacity:.8;width:70%;margin-top:0}
.arrow{font:900 70px Arial,sans-serif;color:#ffcf3f;text-align:center;margin:10px 0}
.md{background:#14141a;border:3px solid #ffcf3f;border-radius:16px;padding:20px 22px;font:700 26px "Courier New",monospace;color:#f2e9dc;box-shadow:8px 8px 0 #000;line-height:1.5}
.md b{color:#ea5b2a}
.note{position:absolute;left:64px;bottom:48px;font:700 30px Arial,sans-serif;color:#f2e9dc}.note b{color:#ffcf3f}
.badge{position:absolute;right:64px;bottom:48px;padding:12px 22px;background:#ffcf3f;color:#0d0d10;font-size:32px;letter-spacing:2px;transform:rotate(-2deg)}
</style>
<section class="thumb" id="feature">
<div class="brand">AISEO<b>SHIFT</b> / TOOLING</div>
<h1>Firecrawl:<span>web data for AI agents</span></h1>
<div class="flow"><div class="page"><i class="h"></i><i></i><i></i><i style="width:60%"></i></div><div class="arrow">&darr;</div><div class="md"><b>#</b> Page title<br><b>##</b> Heading<br>Clean text...</div></div>
<div class="note"><b>Your site</b> is the source. Check robots.txt.</div>
<div class="badge">NOV 2026</div>
</section></html>
